{% extends "base.html" %}
{% block title %}Delete report{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 py-16">
    <div class="bg-white rounded-2xl shadow-xl border border-stone-200 p-8">
        <h1 class="font-serif text-2xl font-bold mb-2">Delete this report?</h1>
        <p class="text-stone-600 mb-6">
            This will permanently remove "<strong>{{ report.item_name }}</strong>". This can't be undone.
        </p>
        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded-full font-medium transition">
                Yes, delete it
            </button>
            <a href="{% url 'reports:detail' report.pk %}" class="text-stone-600 px-6 py-2.5 font-medium hover:text-stone-900">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
