{% extends "base_auth.html" %}
{% block title %}Password reset{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-stone-200 p-8 sm:p-10 text-center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" class="mx-auto mb-4">
            <circle cx="12" cy="12" r="9" stroke="#16A34A" stroke-width="1.8"/>
            <path d="M8 12L11 15L16 9" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 class="text-2xl font-bold mb-2">Password reset</h1>
        <p class="text-stone-500 text-sm mb-6">Your password has been changed. You can log in now.</p>
        <a href="{% url 'accounts:login' %}"
           class="inline-block bg-amber-600 hover:bg-amber-700 text-white px-6 py-2.5 rounded-full font-medium transition">
            Log in
        </a>
    </div>
</div>
{% endblock %}
