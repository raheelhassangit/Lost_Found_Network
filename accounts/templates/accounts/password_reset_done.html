{% extends "base_auth.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-stone-200 p-8 sm:p-10 text-center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" class="mx-auto mb-4">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="#D97706" stroke-width="1.8"/>
            <path d="M3 7L12 13L21 7" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 class="text-2xl font-bold mb-2">Check your email</h1>
        <p class="text-stone-500 text-sm mb-6">
            If an account exists with that email, we've sent a link to reset your password.
        </p>
        <a href="{% url 'accounts:login' %}" class="text-amber-600 font-medium text-sm">Back to login</a>
    </div>
</div>
{% endblock %}
