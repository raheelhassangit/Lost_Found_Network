{% extends "base_auth.html" %}
{% block title %}Reset your password{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-stone-200 p-8 sm:p-10">
        <a href="{% url 'core:home' %}" class="flex items-center gap-2 mb-8 w-fit">
            <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
                <path d="M9 3H19L25 9V22C25 23.1 24.1 24 23 24H9C7.9 24 7 23.1 7 22V5C7 3.9 7.9 3 9 3Z"
                      stroke="#D97706" stroke-width="1.8" stroke-linejoin="round"/>
                <circle cx="13.5" cy="9.5" r="1.6" stroke="#D97706" stroke-width="1.6"/>
            </svg>
            <span class="font-serif text-lg font-bold">Lost <span class="text-amber-600">&amp;</span> Found</span>
        </a>

        <h1 class="text-2xl font-bold mb-1">Forgot your password?</h1>
        <p class="text-stone-500 text-sm mb-7">Enter your email and we'll send you a reset link.</p>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs tracking-wide text-gray-500 mb-1">Email</label>
                <input type="email" name="email" required
                       class="w-full border-b border-gray-300 focus:border-amber-600 outline-none py-2 bg-transparent">
            </div>
            <button type="submit"
                    class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-full font-medium transition">
                Send reset link
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            <a href="{% url 'accounts:login' %}" class="text-amber-600 font-medium">Back to login</a>
        </p>
    </div>
</div>
{% endblock %}
